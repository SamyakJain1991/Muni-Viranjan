<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - जनसंत परिवार</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 0;
background: #fff;
}
header {
background: #ff9933;
color: white;
padding: 10px;
text-align: center;
}
nav {
background: #f4f4f4;
padding: 10px;
text-align: center;
}
nav a {
margin: 0 15px;
text-decoration: none;
color: #333;
}
.content {
padding: 20px;
text-align: center;
}
.video-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
gap: 20px;
max-width: 1200px;
margin: 0 auto;
padding: 20px;
}
.video-card {
background: #f9f9f9;
border-radius: 10px;
overflow: hidden;
box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.video-card .video-wrap {
position: relative;
padding-top: 56.25%;
}
.video-card iframe {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
border: 0;
}
.video-card h3 {
margin: 0;
padding: 12px;
font-size: 1rem;
}
.subscribe-cta {
margin: 30px auto;
display: inline-block;
background: #ff0000;
color: white;
padding: 10px 20px;
border-radius: 6px;
text-decoration: none;
font-weight: bold;
}
@media (max-width: 600px) {
.video-grid {
grid-template-columns: 1fr;
}
}
</style>
</head>
<body>
<header>
<h1>जनसंत परिवार</h1>
</header>
<nav>
<a href="jansant1.html" data-hi="होम" data-en="Home">Home</a>
<a href="profiles.html" data-hi="प्रोफाइल" data-en="Profiles">Profiles</a>
<a href="programmes.html" data-hi="कार्यक्रम" data-en="Programs">Programs</a>
<a href="gallery.html" data-hi="गैलरी" data-en="Gallery">Gallery</a>
<a href="videos.html" data-hi="वीडियो" data-en="Videos">Videos</a>
<a href="upcoming.html" data-hi="आगामी कार्यक्रम" data-en="Upcoming">Upcoming</a>
<a href="contact.html" data-hi="संपर्क" data-en="Contact">Contact</a>
<button id="lang-toggle-btn" onclick="toggleLang()" style="margin-left:15px;padding:4px 12px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:0.85rem;">EN</button>
</nav>
<div class="content">
<h2 data-hi="वीडियो गैलरी" data-en="Video Gallery">वीडियो गैलरी</h2>
<div id="video-loading" data-hi="वीडियो लोड हो रहे हैं..." data-en="Loading videos...">वीडियो लोड हो रहे हैं...</div>
<div class="video-grid" id="video-container"></div>
<a class="subscribe-cta" href="https://www.youtube.com/@ViranjansagarjiOfficial" target="_blank" rel="noopener"
data-hi="YouTube पर Subscribe करें" data-en="Subscribe on YouTube">YouTube पर Subscribe करें</a>
</div>
<script>
async function loadVideos() {
const container = document.getElementById('video-container');
const loading = document.getElementById('video-loading');
try {
const res = await fetch('videos.json');
const videos = await res.json();
loading.style.display = 'none';
const valid = (videos || []).filter(v => v.youtubeId);
if (valid.length === 0) {
container.innerHTML = '<p>अभी कोई वीडियो जोड़ा नहीं गया है।</p>';
return;
}
container.innerHTML = valid.map(v => `
<div class="video-card">
<div class="video-wrap">
<iframe src="https://www.youtube.com/embed/${v.youtubeId}" title="${v.title || 'Video'}" allowfullscreen loading="lazy"></iframe>
</div>
<h3>${v.title || ''}</h3>
</div>
`).join('');
} catch (err) {
loading.textContent = 'वीडियो लोड करने में समस्या हुई।';
console.error('Video load error:', err);
}
}
loadVideos();
</script>
<script src="i18n.js"></script>
</body>
</html>

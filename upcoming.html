<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upcoming Programs - जनसंत परिवार</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 0;
background: #fff;
}
header {
background: #ff9933;
color: white;
padding: 10px;
text-align: center;
}
nav {
background: #f4f4f4;
padding: 10px;
text-align: center;
}
nav a {
margin: 0 15px;
text-decoration: none;
color: #333;
}
.content {
padding: 20px;
text-align: center;
}
h3.section-title {
margin-top: 40px;
color: #ff9933;
}
.program-details {
margin: 20px auto;
max-width: 800px;
padding: 15px;
background: #f9f9f9;
border-radius: 5px;
display: flex;
align-items: center;
gap: 20px;
position: relative;
text-align: left;
}
.program-details.past {
opacity: 0.7;
background: #f0f0f0;
}
.program-details .details {
flex: 1;
text-align: left;
}
.program-details ul {
list-style-type: none;
padding: 0;
margin: 0;
}
.program-details li {
margin: 10px 0;
line-height: 1.6;
font-size: clamp(14px, 4vw, 16px);
}
.program-details li strong {
margin-right: 10px;
}
.program-details img {
max-width: 250px;
height: auto;
border-radius: 10px;
}
.action-links {
margin-top: 10px;
display: flex;
gap: 10px;
flex-wrap: wrap;
}
.action-links a {
font-size: 13px;
background: #eee;
padding: 4px 10px;
border-radius: 6px;
text-decoration: none;
color: #333;
border: 1px solid #ccc;
}
.action-links a:hover {
background: #ddd;
}
.delete-event-btn {
position: absolute;
top: 8px;
right: 8px;
background: #cc0000;
color: white;
border: none;
border-radius: 6px;
padding: 4px 10px;
cursor: pointer;
font-size: 12px;
}
#admin-panel input {
width: 90%;
max-width: 400px;
padding: 8px;
margin: 6px 0;
border: 1px solid #ccc;
border-radius: 6px;
}
#admin-panel button, #admin-login button {
background: #ff9933;
color: white;
border: none;
padding: 8px 18px;
border-radius: 6px;
cursor: pointer;
margin-top: 8px;
}
@media (max-width: 768px) {
.program-details {
flex-direction: column;
text-align: center;
padding: 10px;
}
.program-details .details {
text-align: center;
}
.program-details img {
max-width: 100%;
margin: 0;
}
.action-links {
justify-content: center;
}
nav a {
margin: 5px 10px;
display: inline-block;
}
}
@media (max-width: 480px) {
header h1 {
font-size: 1.5rem;
}
.content h2 {
font-size: 1.2rem;
}
}
</style>
</head>
<body>
<header>
<h1>जनसंत परिवार</h1>
</header>
<nav>
<a href="jansant1.html" data-hi="होम" data-en="Home">Home</a>
<a href="profiles.html" data-hi="प्रोफाइल" data-en="Profiles">Profiles</a>
<a href="programmes.html" data-hi="कार्यक्रम" data-en="Programs">Programs</a>
<a href="gallery.html" data-hi="गैलरी" data-en="Gallery">Gallery</a>
<a href="videos.html" data-hi="वीडियो" data-en="Videos">Videos</a>
<a href="upcoming.html" data-hi="आगामी कार्यक्रम" data-en="Upcoming">Upcoming</a>
<a href="contact.html" data-hi="संपर्क" data-en="Contact">Contact</a>
<button id="lang-toggle-btn" onclick="toggleLang()" style="margin-left:15px;padding:4px 12px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:0.85rem;">EN</button>
</nav>
<div class="content">
<h2 data-hi="आगामी कार्यक्रम" data-en="Upcoming Programs">आगामी कार्यक्रम</h2>
<div id="event-loading" data-hi="लोड हो रहा है..." data-en="Loading...">लोड हो रहा है...</div>
<div id="upcoming-list"></div>

<h3 class="section-title" id="past-title" style="display:none" data-hi="पिछले कार्यक्रम" data-en="Past Programs">पिछले कार्यक्रम</h3>
<div id="past-list"></div>

<div id="admin-login" style="margin-top: 30px;">
<input type="password" id="admin-password" placeholder="Admin Password">
<button onclick="checkAdmin()">Login</button>
<div id="login-msg"></div>
</div>

<div id="admin-panel" style="display: none; margin-top: 20px; max-width: 500px; margin-left: auto; margin-right: auto;">
<h3>नया कार्यक्रम जोड़ें</h3>
<input type="text" id="event-name" placeholder="कार्यक्रम का नाम"><br>
<input type="date" id="event-date"><br>
<input type="text" id="event-location" placeholder="स्थान"><br>
<input type="text" id="event-description" placeholder="विवरण"><br>
<input type="text" id="event-organizer" placeholder="आयोजक"><br>
<label style="display:block;margin-top:10px;font-size:14px;">फोटो (optional):</label>
<input type="file" id="event-image-file" accept="image/*"><br>
<button onclick="addEvent()">कार्यक्रम जोड़ें</button>
<div id="admin-msg"></div>
</div>
</div>

<script>
let adminPassword = '';

function mapsLink(location) {
  if (!location) return '';
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`;
}

function gcalLink(ev) {
  if (!ev.date) return '';
  const dateStr = ev.date.replace(/-/g, '');
  const details = encodeURIComponent(ev.description || '');
  const loc = encodeURIComponent(ev.location || '');
  const title = encodeURIComponent(ev.name || 'जनसंत कार्यक्रम');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dateStr}/${dateStr}&details=${details}&location=${loc}`;
}

function renderEvent(ev, isPast) {
  return `
<div class="program-details ${isPast ? 'past' : ''}">
${adminPassword ? `<button class="delete-event-btn" onclick="deleteEvent('${ev.id}')">✕ हटाएं</button>` : ''}
<div class="details">
<ul>
<li><strong>कार्यक्रम का नाम:</strong> ${ev.name || ''}</li>
<li><strong>तिथि:</strong> ${ev.date || ''}</li>
<li><strong>स्थान:</strong> ${ev.location || ''}</li>
<li><strong>विवरण:</strong> ${ev.description || ''}</li>
<li><strong>आयोजक:</strong> ${ev.organizer || ''}</li>
</ul>
${!isPast ? `
<div class="action-links">
${ev.date ? `<a href="${gcalLink(ev)}" target="_blank" rel="noopener">📅 Calendar में जोड़ें</a>` : ''}
${ev.location ? `<a href="${mapsLink(ev.location)}" target="_blank" rel="noopener">📍 Maps पर देखें</a>` : ''}
</div>` : ''}
</div>
${ev.image ? `<img src="${ev.image}" alt="Program Photo">` : ''}
</div>
`;
}

async function loadEvents() {
const upcomingList = document.getElementById('upcoming-list');
const pastList = document.getElementById('past-list');
const pastTitle = document.getElementById('past-title');
const loading = document.getElementById('event-loading');
try {
const res = await fetch('/.netlify/functions/get_events');
const events = await res.json();
loading.style.display = 'none';
if (!Array.isArray(events) || events.length === 0) {
upcomingList.innerHTML = '<p>अभी कोई आगामी कार्यक्रम नहीं है।</p>';
return;
}
const today = new Date().toISOString().slice(0, 10);
const upcoming = events.filter(e => !e.date || e.date >= today);
const past = events.filter(e => e.date && e.date < today).reverse();

upcomingList.innerHTML = upcoming.length
  ? upcoming.map(ev => renderEvent(ev, false)).join('')
  : '<p>अभी कोई आगामी कार्यक्रम नहीं है।</p>';

if (past.length) {
  pastTitle.style.display = 'block';
  pastList.innerHTML = past.map(ev => renderEvent(ev, true)).join('');
}
} catch (err) {
loading.textContent = 'लोड करने में समस्या हुई।';
console.error('Events load error:', err);
}
}

async function checkAdmin() {
const password = document.getElementById('admin-password').value;
const msg = document.getElementById('login-msg');
if (!password) { msg.textContent = 'Password डालें।'; return; }
msg.textContent = 'जांच हो रही है...';
try {
const res = await fetch('/.netlify/functions/verify-password', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ password })
});
const data = await res.json();
if (data.valid) {
adminPassword = password;
document.getElementById('admin-login').style.display = 'none';
document.getElementById('admin-panel').style.display = 'block';
loadEvents();
} else {
msg.textContent = 'गलत पासवर्ड।';
}
} catch (err) {
msg.textContent = 'लॉगिन में समस्या हुई।';
console.error(err);
}
}

async function uploadEventImage(file) {
const dataBase64 = await new Promise((resolve, reject) => {
const reader = new FileReader();
reader.onload = () => resolve(reader.result.split(',')[1]);
reader.onerror = reject;
reader.readAsDataURL(file);
});
const res = await fetch('/.netlify/functions/upload-photo', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
body: JSON.stringify({ filename: file.name, contentType: file.type, dataBase64 })
});
if (!res.ok) throw new Error('Image upload failed');
const data = await res.json();
return data.url;
}

async function addEvent() {
const msg = document.getElementById('admin-msg');
const fileInput = document.getElementById('event-image-file');
const eventData = {
name: document.getElementById('event-name').value,
date: document.getElementById('event-date').value,
location: document.getElementById('event-location').value,
description: document.getElementById('event-description').value,
organizer: document.getElementById('event-organizer').value,
image: ''
};
if (!eventData.name || !eventData.date) {
msg.textContent = 'नाम और तिथि जरूरी है।';
return;
}
msg.textContent = 'सेव हो रहा है...';
try {
if (fileInput.files && fileInput.files[0]) {
msg.textContent = 'फोटो अपलोड हो रही है...';
eventData.image = await uploadEventImage(fileInput.files[0]);
}
const res = await fetch('/.netlify/functions/update_events', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
body: JSON.stringify({ event: eventData })
});
if (res.status === 401) {
msg.textContent = 'गलत पासवर्ड। दोबारा लॉगिन करें।';
return;
}
msg.textContent = 'कार्यक्रम जुड़ गया!';
document.getElementById('event-name').value = '';
document.getElementById('event-date').value = '';
document.getElementById('event-location').value = '';
document.getElementById('event-description').value = '';
document.getElementById('event-organizer').value = '';
fileInput.value = '';
loadEvents();
} catch (err) {
msg.textContent = 'सेव करने में समस्या हुई।';
console.error(err);
}
}

async function deleteEvent(id) {
if (!confirm('क्या आप यह कार्यक्रम हटाना चाहते हैं?')) return;
try {
const res = await fetch('/.netlify/functions/update_events', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
body: JSON.stringify({ operation: 'delete', id })
});
if (res.status === 401) {
alert('गलत पासवर्ड। दोबारा लॉगिन करें।');
return;
}
loadEvents();
} catch (err) {
alert('हटाने में समस्या हुई।');
console.error(err);
}
}

loadEvents();
</script>
<script src="i18n.js"></script>
</body>
</html>
